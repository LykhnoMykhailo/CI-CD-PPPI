# docs/api/swagger.yaml
openapi: 3.0.0
info:
  title: Discount Calculator API
  version: 1.0.0
  description: Гіпотетичний API для розрахунку знижок, пов'язаний з логікою нашого discount_service.py
paths:
  /calculate-discount:
    post:
      summary: Calculate final price after discount (Розрахунок фінальної ціни)
      tags:
        - Discounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscountRequest'
      responses:
        '200':
          description: Successful calculation (Успішний розрахунок)
          content:
            application/json:
              schema:
                type: object
                properties:
                  finalPrice:
                    type: number
                    format: float
                    description: Ціна після знижки
        '400':
          description: Invalid input (Невірні вхідні дані, наприклад, від'ємна знижка)

  /products:
    get:
      summary: Get list of all products (Отримати список усіх товарів)
      tags:
        - Products
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

components:
  schemas:
    DiscountRequest:
      type: object
      properties:
        originalPrice:
          type: number
          format: float
          description: Початкова ціна
        discountPercent:
          type: number
          format: float
          description: Відсоток знижки (0-100)
      required:
        - originalPrice
        - discountPercent
    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          type: number
          format: float